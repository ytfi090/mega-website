<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTHER | MEGA PROJECT</title>
    <style>
        :root {
            --glow: #00f2ff;
            --accent: #7000ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            height: 100vh;
        }

        /* --- HOME PAGE SECTION --- */
        #home-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
            transition: transform 1s cubic-bezier(0.85, 0, 0.15, 1), opacity 0.8s;
        }

        .hero-title {
            font-size: 5rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.3));
        }

        .hero-subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 3px;
        }

        .enter-btn {
            padding: 15px 40px;
            background: transparent;
            border: 1px solid var(--glow);
            color: var(--glow);
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
        }

        .enter-btn:hover {
            background: var(--glow);
            color: black;
            box-shadow: 0 0 30px var(--glow);
        }

        /* --- ACCESS PAGE SECTION (HIDDEN INITIALLY) --- */
        #access-page {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: black;
            transform: translateY(100%); /* Start off-screen */
            transition: transform 1s cubic-bezier(0.85, 0, 0.15, 1);
            z-index: 10;
        }

        .terminal-box {
            width: 400px;
            padding: 40px;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 2px;
            text-align: center;
        }

        #pass-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--glow);
            color: var(--glow);
            font-size: 1.5rem;
            text-align: center;
            margin-top: 20px;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- ANIMATION CLASSES --- */
        .slide-up { transform: translateY(-100%) !important; opacity: 0; }
        .active-access { transform: translateY(0%) !important; }

    </style>
</head>
<body>

    <section id="home-page">
        <h1 class="hero-title">ANTHER</h1>
        <p class="hero-subtitle">OS DEMO • MOVIE HUB • TEAM CONTENT</p>
        <button class="enter-btn" onclick="goToAccess()">Initiate Connection</button>
    </section>

    <section id="access-page">
        <div class="terminal-box">
            <p style="color: #444; font-size: 0.8rem; margin-bottom: 10px;">[ ENCRYPTED CHANNEL ]</p>
            <h3>IDENTITY REQUIRED</h3>
            <input type="password" id="pass-input" placeholder="••••••••" maxlength="8">
            <p id="error-log" style="color: red; font-size: 0.7rem; margin-top: 10px; min-height: 15px;"></p>
        </div>
    </section>

    <script>
        function goToAccess() {
            document.getElementById('home-page').classList.add('slide-up');
            document.getElementById('access-page').classList.add('active-access');
            // Auto-focus the password field
            setTimeout(() => {
                document.getElementById('pass-input').focus();
            }, 1000);
        }

        const passInput = document.getElementById('pass-input');
        const errorLog = document.getElementById('error-log');

        passInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                // We can set your specific access key here
                if (passInput.value === 'ANTHER7') { 
                    alert("ACCESS GRANTED. Welcome to the Hub.");
                    // In the next phase, we'll redirect to the Dashboard
                } else {
                    errorLog.innerText = "INVALID KEY. ACCESS DENIED.";
                    passInput.value = "";
                    // Small shake animation could go here
                }
            }
        });
    </script>
</body>
</html>
